name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify and build production site
        run: |
          set -o pipefail
          npm ci
          npm run check:i18n 2>&1 | tee /tmp/coverage-output.log
          npm run verify:release 2>&1 | tee /tmp/verify-output.log
          npm run typecheck
          npm run build

      - name: Report failing checks
        if: failure()
        run: |
          failures=$(grep -hE '^(not ok [0-9]+ - |[[:space:]]*✖ )' /tmp/verify-output.log 2>/dev/null | sed -E 's/^[[:space:]]*✖ //; s/^not ok [0-9]+ - //; s/ \([0-9.]+m?s\)$//; /^failing tests:$/d' | sort -u | head -20)
          reasons=$(awk '/Release verification: FAIL/{flag=1; next} flag && /^- /{sub(/^- /, ""); print}' /tmp/verify-output.log 2>/dev/null | head -10)
          printf '%s\n' "$failures" | while IFS= read -r name; do
            [ -n "$name" ] && echo "::error title=Failing test::$name"
          done
          printf '%s\n' "$reasons" | while IFS= read -r reason; do
            [ -n "$reason" ] && echo "::error title=Release verification::$reason"
          done
          if [ -n "$failures" ] || [ -n "$reasons" ]; then
            {
              echo '## ❌ What failed'
              printf '%s\n' "$failures" | sed 's/^/- 🧪 /'
              printf '%s\n' "$reasons" | sed 's/^/- 📦 /'
            } > "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
