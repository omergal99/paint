name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify and build production site
        run: |
          set -o pipefail
          npm ci
          npm run check:i18n 2>&1 | tee /tmp/coverage-output.log
          npm run verify:release 2>&1 | tee /tmp/verify-output.log
          npm run typecheck
          npm run build

      - name: Report failing checks
        if: failure()
        run: |
          failures=$(grep -hE '^not ok [0-9]+ - ' /tmp/verify-output.log 2>/dev/null | sed 's/^not ok [0-9]* - //' | sort -u | head -20)
          reasons=$(awk '/Release verification: FAIL/{flag=1; next} flag && /^- /{sub(/^- /, ""); print}' /tmp/verify-output.log 2>/dev/null | head -10)
          printf '%s\n' "$failures" | while IFS= read -r name; do
            [ -n "$name" ] && echo "::error title=Failing test::$name"
          done
          printf '%s\n' "$reasons" | while IFS= read -r reason; do
            [ -n "$reason" ] && echo "::error title=Release verification::$reason"
          done
          if [ -n "$failures" ] || [ -n "$reasons" ]; then
            {
              echo '## ❌ What failed'
              printf '%s\n' "$failures" | sed 's/^/- 🧪 /'
              printf '%s\n' "$reasons" | sed 's/^/- 📦 /'
            } > "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
