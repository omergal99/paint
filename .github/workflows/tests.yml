name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Run tests and localization coverage
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.log
          npm run check:i18n 2>&1 | tee /tmp/coverage-output.log
          npm run verify:release 2>&1 | tee /tmp/verify-output.log
      - name: Report failures with annotations
        if: failure()
        run: |
          failures=$(grep -hE '^(not ok [0-9]+ - |[[:space:]]*✖ )' /tmp/test-output.log /tmp/verify-output.log 2>/dev/null | sed -E 's/^[[:space:]]*✖ //; s/^not ok [0-9]+ - //; s/ \([0-9.]+m?s\)$//; /^failing tests:$/d' | sort -u | head -20)
          reasons=$(awk '/Release verification: FAIL/{flag=1; next} flag && /^- /{sub(/^- /, ""); print}' /tmp/verify-output.log 2>/dev/null | head -10)
          printf '%s\n' "$failures" | while IFS= read -r name; do
            [ -n "$name" ] && echo "::error title=Failing test::$name"
          done
          printf '%s\n' "$reasons" | while IFS= read -r reason; do
            [ -n "$reason" ] && echo "::error title=Release verification::$reason"
          done
          if [ -n "$failures" ] || [ -n "$reasons" ]; then
            {
              echo '## ❌ What failed'
              printf '%s\n' "$failures" | sed 's/^/- 🧪 /'
              printf '%s\n' "$reasons" | sed 's/^/- 📦 /'
            } > "${GITHUB_STEP_SUMMARY}"
          fi
